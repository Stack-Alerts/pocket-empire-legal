<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index,follow">
<title>Contact — Pocket Empire</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-head">
  <a class="brand" href="index.html">Pocket<span> Empire</span></a>
  <nav>
    <a href="index.html">Home</a>
    <a href="terms.html">Terms</a>
    <a href="privacy.html">Privacy</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>
</header>

<main class="legal">
  <h1>Contact</h1>
  <p>Send us a message and we will reply to the address you provide. We do not
  publish or share that address.</p>

  <div class="card">
    <form class="contact" id="contact-form" method="POST" action="https://formspree.io/f/FORM_ID" accept-charset="UTF-8">
      <input type="text" name="name" placeholder="Your name" required>
      <input type="email" name="email" placeholder="Your email address" required>
      <textarea name="message" rows="5" placeholder="How can we help?" required></textarea>
      <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
      <input type="hidden" name="_subject" value="Pocket Empire enquiry">
      <button type="submit">Send message</button>
      <p class="formnote" id="form-note">We reply within a few working days.</p>
    </form>
  </div>
</main>

<footer class="site-foot">
  <div class="inner">
    <span>© 2026 Pocket Empire</span>
    <div>
      <a href="terms.html">Terms of Service</a>
      &nbsp;·&nbsp;
      <a href="privacy.html">Privacy Policy</a>
      &nbsp;·&nbsp;
      <a href="contact.html">Contact</a>
    </div>
  </div>
</footer>

<script>
/* No contact address is published anywhere on this site — not in the markup,
   not in any script. The form posts straight to the form service. */
(function () {
  var form = document.getElementById('contact-form');
  var note = document.getElementById('form-note');
  if (!form) return;
  if (form.action.indexOf('FORM_ID') !== -1) {
    note.textContent = 'The contact form is being provisioned. Please check back shortly.';
    form.querySelector('button').disabled = true;
  }
})();
</script>
</body>
</html>
